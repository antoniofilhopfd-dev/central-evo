<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos — Central Evolução</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/evolucao-icone-laranja.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="topbar">
  <div class="marca"><img class="logo" src="assets/logo/evolucao-lockup-branco.svg" alt="Colégio Evolução"><span>Central</span></div>
  <div class="status-indicadores"><span><i class="bolinha" id="ind-nuvem"></i> Nuvem (API)</span></div>
</div>

<div class="container">
  <div class="rodape-nav"><a href="index.html">&larr; Voltar para a Central</a></div>
  <h1>Eventos</h1>

  <section class="secao">
    <div class="resumo-cards" id="resumo-eventos">
      <div class="resumo-card"><div class="numero" id="resumo-planejamento">0</div><div class="rotulo">Planejamento</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-proximos">0</div><div class="rotulo">Próximos</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-hoje">0</div><div class="rotulo">Hoje</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-concluido">0</div><div class="rotulo">Concluídos</div></div>
    </div>
  </section>

  <section class="secao">
    <div class="toolbar">
      <button class="btn-primario" id="btn-novo">+ Novo evento</button>
      <select id="filtro-status">
        <option value="">Status: Todos</option>
        <option value="planejamento">Planejamento</option><option value="pronto">Pronto</option><option value="concluido">Concluído</option>
      </select>
      <select id="filtro-segmento">
        <option value="">Segmento: Todos</option>
        <option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option>
      </select>
    </div>
    <div id="lista-eventos" style="display:flex;flex-direction:column;gap:12px;"></div>
  </section>
</div>

<div class="modal-overlay oculto" id="modal">
  <div class="modal" style="max-width:560px;">
    <h2 id="modal-titulo">Novo evento</h2>
    <input type="hidden" id="campo-id">
    <div class="campo"><label>Nome</label><input type="text" id="campo-nome"></div>
    <div class="campo"><label>Status</label>
      <select id="campo-status"><option value="planejamento">Planejamento</option><option value="pronto">Pronto</option><option value="concluido">Concluído</option></select>
    </div>
    <div class="campo"><label>Segmento</label>
      <select id="campo-segmento"><option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option></select>
    </div>
    <div class="campo oculto" id="grupo-etapa-infantil"><label>Etapa do Infantil</label>
      <select id="campo-etapa-infantil"><option value="">—</option><option value="todo_infantil">Todo Infantil</option>
        <option value="maternal">Maternal</option><option value="jardim">Jardim</option></select>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="campo" style="flex:1"><label>Data</label><input type="date" id="campo-data"></div>
      <div class="campo" style="flex:1"><label>Hora</label><input type="text" id="campo-hora" placeholder="HH:MM"></div>
    </div>
    <div class="campo"><label>Local</label><input type="text" id="campo-local"></div>
    <div class="campo"><label>Descrição/objetivo</label><textarea id="campo-descricao" rows="2"></textarea></div>
    <div class="campo"><label>Etapas de preparação</label>
      <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:0.82rem;">
        <label><input type="checkbox" id="et-divulgacao"> Divulgação</label>
        <label><input type="checkbox" id="et-foto"> Foto</label>
        <label><input type="checkbox" id="et-video"> Vídeo</label>
        <label><input type="checkbox" id="et-pos"> Pós-evento</label>
      </div>
    </div>
    <div class="campo"><label>Link principal</label><input type="text" id="campo-link"></div>
    <div class="modal-acoes">
      <button class="btn-secundario" id="btn-cancelar">Cancelar</button>
      <button class="btn-secundario oculto" id="btn-duplicar">Duplicar</button>
      <button class="btn-perigo oculto" id="btn-excluir">Excluir</button>
      <button class="btn-primario" id="btn-salvar">Salvar</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/eventos.js"></script>
</body>
</html>
