<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos — Central Evolução</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/evolucao-icone-laranja.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="topbar">
  <div class="marca"><img class="logo" src="assets/logo/evolucao-lockup-branco.svg" alt="Colégio Evolução"><span>Central</span></div>
  <div class="status-indicadores"><span><i class="bolinha" id="ind-nuvem"></i> Nuvem (API)</span></div>
</div>

<div class="container">
  <div class="rodape-nav"><a href="index.html">&larr; Voltar para a Central</a></div>
  <h1>Projetos</h1>

  <section class="secao">
    <div class="resumo-cards" id="resumo-projetos">
      <div class="resumo-card"><div class="numero" id="resumo-planejamento">0</div><div class="rotulo">Planejamento</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-em_andamento">0</div><div class="rotulo">Em andamento</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-pausado">0</div><div class="rotulo">Pausados</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-concluido">0</div><div class="rotulo">Concluídos</div></div>
    </div>
  </section>

  <section class="secao">
    <div class="toolbar">
      <button class="btn-primario" id="btn-novo">+ Novo projeto</button>
      <select id="filtro-status">
        <option value="">Status: Todos</option>
        <option value="planejamento">Planejamento</option><option value="em_andamento">Em andamento</option>
        <option value="pausado">Pausado</option><option value="concluido">Concluído</option>
      </select>
      <select id="filtro-prioridade">
        <option value="">Prioridade: Todas</option>
        <option value="alta">Alta</option><option value="normal">Normal</option><option value="baixa">Baixa</option>
      </select>
      <select id="filtro-segmento">
        <option value="">Segmento: Todos</option>
        <option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option>
      </select>
    </div>
    <div id="lista-projetos" style="display:flex;flex-direction:column;gap:12px;"></div>
  </section>
</div>

<div class="modal-overlay oculto" id="modal">
  <div class="modal" style="max-width:560px;">
    <h2 id="modal-titulo">Novo projeto</h2>
    <input type="hidden" id="campo-id">
    <div class="campo"><label>Nome</label><input type="text" id="campo-nome"></div>
    <div class="campo"><label>Status</label>
      <select id="campo-status"><option value="planejamento">Planejamento</option><option value="em_andamento">Em andamento</option>
        <option value="pausado">Pausado</option><option value="concluido">Concluído</option></select>
    </div>
    <div class="campo"><label>Prioridade</label>
      <select id="campo-prioridade"><option value="normal">Normal</option><option value="alta">Alta</option><option value="baixa">Baixa</option></select>
    </div>
    <div class="campo"><label>Segmento</label>
      <select id="campo-segmento"><option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option></select>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="campo" style="flex:1"><label>Início</label><input type="date" id="campo-inicio"></div>
      <div class="campo" style="flex:1"><label>Prazo final</label><input type="date" id="campo-prazo-final"></div>
    </div>
    <div class="campo"><label>Progresso manual (%) — ignorado se houver marcos</label><input type="text" id="campo-progresso"></div>
    <div class="campo"><label>Objetivo</label><textarea id="campo-objetivo" rows="2"></textarea></div>
    <div class="campo"><label>Próximo passo</label><input type="text" id="campo-proximo-passo"></div>
    <div class="campo"><label>Links importantes</label><input type="text" id="campo-links"></div>
    <div class="campo"><label>Observações</label><textarea id="campo-observacoes" rows="2"></textarea></div>

    <div class="campo" id="grupo-milestones" style="display:none;">
      <label>Marcos (milestones)</label>
      <div id="lista-milestones" style="display:flex;flex-direction:column;gap:4px;margin-bottom:6px;"></div>
      <div style="display:flex;gap:6px;">
        <input type="text" id="novo-milestone" placeholder="Novo marco..." style="flex:1">
        <button class="btn-secundario" id="btn-add-milestone" type="button">Adicionar</button>
      </div>
    </div>

    <div class="modal-acoes">
      <button class="btn-secundario" id="btn-cancelar">Cancelar</button>
      <button class="btn-secundario oculto" id="btn-duplicar">Duplicar</button>
      <button class="btn-perigo oculto" id="btn-excluir">Excluir</button>
      <button class="btn-primario" id="btn-salvar">Salvar</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/projetos.js"></script>
</body>
</html>
