<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteúdo — Central Evolução</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/evolucao-icone-laranja.svg">
<link rel="stylesheet" href="css/app.css">
<style>.kanban { grid-template-columns: repeat(5, 1fr); }</style>
</head>
<body>

<div class="topbar">
  <div class="marca"><img class="logo" src="assets/logo/evolucao-lockup-branco.svg" alt="Colégio Evolução"><span>Central</span></div>
  <div class="status-indicadores"><span><i class="bolinha" id="ind-nuvem"></i> Nuvem (API)</span></div>
</div>

<div class="container">
  <div class="rodape-nav"><a href="index.html">&larr; Voltar para a Central</a></div>
  <h1>Conteúdo</h1>

  <section class="secao">
    <div class="resumo-cards" id="resumo-conteudo">
      <div class="resumo-card"><div class="numero" id="resumo-ideia">0</div><div class="rotulo">Ideias</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-producao">0</div><div class="rotulo">Produção</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-aprovacao">0</div><div class="rotulo">Aprovação</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-programado">0</div><div class="rotulo">Programado</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-publicado">0</div><div class="rotulo">Publicado</div></div>
    </div>
  </section>

  <section class="secao">
    <div class="toolbar">
      <button class="btn-primario" id="btn-novo">+ Novo conteúdo</button>
      <select id="filtro-tipo">
        <option value="">Tipo: Todos</option>
        <option value="post">Post</option><option value="reels">Reels/Vídeo</option><option value="story">Story</option>
        <option value="design">Design</option><option value="foto">Foto</option><option value="outro">Outro</option>
      </select>
      <select id="filtro-segmento">
        <option value="">Segmento: Todos</option>
        <option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option>
      </select>
      <span style="flex:1"></span>
      <button class="btn-secundario ativo" id="btn-vista-quadro">Quadro</button>
      <button class="btn-secundario" id="btn-vista-lista">Lista</button>
    </div>

    <div id="vista-quadro">
      <div class="kanban">
        <div class="kanban-coluna" data-etapa="ideia"><h3>Ideias</h3><div class="kanban-lista" id="kanban-ideia"></div></div>
        <div class="kanban-coluna" data-etapa="producao"><h3>Produção</h3><div class="kanban-lista" id="kanban-producao"></div></div>
        <div class="kanban-coluna" data-etapa="aprovacao"><h3>Aprovação</h3><div class="kanban-lista" id="kanban-aprovacao"></div></div>
        <div class="kanban-coluna" data-etapa="programado"><h3>Programado</h3><div class="kanban-lista" id="kanban-programado"></div></div>
        <div class="kanban-coluna" data-etapa="publicado"><h3>Publicado</h3><div class="kanban-lista" id="kanban-publicado"></div></div>
      </div>
    </div>
    <div id="vista-lista" class="oculto"><div class="lista-tarefas" id="lista-conteudo"></div></div>
  </section>
</div>

<div class="modal-overlay oculto" id="modal">
  <div class="modal">
    <h2 id="modal-titulo">Novo conteúdo</h2>
    <input type="hidden" id="campo-id">
    <div class="campo"><label>Título</label><input type="text" id="campo-titulo"></div>
    <div class="campo"><label>Etapa</label>
      <select id="campo-etapa">
        <option value="ideia">Ideia</option><option value="producao">Produção</option>
        <option value="aprovacao">Aprovação</option><option value="programado">Programado</option>
        <option value="publicado">Publicado</option>
      </select>
    </div>
    <div class="campo"><label>Tipo</label>
      <select id="campo-tipo-item">
        <option value="post">Post</option><option value="reels">Reels/Vídeo</option><option value="story">Story</option>
        <option value="design">Design</option><option value="foto">Foto</option><option value="outro">Outro</option>
      </select>
    </div>
    <div class="campo"><label>Segmento</label>
      <select id="campo-segmento-item">
        <option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option>
      </select>
    </div>
    <div class="campo oculto" id="grupo-etapa-infantil"><label>Etapa do Infantil</label>
      <select id="campo-etapa-infantil"><option value="">—</option><option value="todo_infantil">Todo Infantil</option>
        <option value="maternal">Maternal</option><option value="jardim">Jardim</option></select>
    </div>
    <div class="campo"><label>Data de publicação</label><input type="date" id="campo-data-publicacao"></div>
    <div class="campo"><label>Briefing / legenda</label><textarea id="campo-briefing" rows="3"></textarea></div>
    <div class="campo"><label>Link (Canva/Drive)</label><input type="text" id="campo-link"></div>
    <div class="campo"><label>CTA</label><input type="text" id="campo-cta"></div>
    <div class="campo"><label>Objetivo</label><input type="text" id="campo-objetivo"></div>
    <div class="campo"><label>Checklist editorial</label>
      <div id="checklist-editorial" style="display:flex;flex-wrap:wrap;gap:10px;font-size:0.82rem;">
        <label><input type="checkbox" data-check="texto"> Texto</label>
        <label><input type="checkbox" data-check="arte"> Arte</label>
        <label><input type="checkbox" data-check="revisao"> Revisão</label>
        <label><input type="checkbox" data-check="aprovacao"> Aprovação</label>
        <label><input type="checkbox" data-check="programacao"> Programação</label>
      </div>
    </div>
    <div class="campo"><label>Observações</label><textarea id="campo-observacoes" rows="2"></textarea></div>
    <div class="modal-acoes">
      <button class="btn-secundario" id="btn-cancelar">Cancelar</button>
      <button class="btn-secundario oculto" id="btn-duplicar">Duplicar</button>
      <button class="btn-perigo oculto" id="btn-excluir">Excluir</button>
      <button class="btn-primario" id="btn-salvar">Salvar</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/conteudo.js"></script>
</body>
</html>
