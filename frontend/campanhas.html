<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campanhas — Central Evolução</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/evolucao-icone-laranja.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="topbar">
  <div class="marca"><img class="logo" src="assets/logo/evolucao-lockup-branco.svg" alt="Colégio Evolução"><span>Central</span></div>
  <div class="status-indicadores"><span><i class="bolinha" id="ind-nuvem"></i> Nuvem (API)</span></div>
</div>

<div class="container">
  <div class="rodape-nav"><a href="index.html">&larr; Voltar para a Central</a></div>
  <h1>Campanhas</h1>

  <section class="secao">
    <div class="resumo-cards" id="resumo-campanhas">
      <div class="resumo-card"><div class="numero" id="resumo-planejamento">0</div><div class="rotulo">Planejamento</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-ativa">0</div><div class="rotulo">Ativas</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-pausada">0</div><div class="rotulo">Pausadas</div></div>
      <div class="resumo-card"><div class="numero" id="resumo-encerrada">0</div><div class="rotulo">Encerradas</div></div>
    </div>
  </section>

  <section class="secao">
    <div class="toolbar">
      <button class="btn-primario" id="btn-novo">+ Nova campanha</button>
      <select id="filtro-status">
        <option value="">Status: Todos</option>
        <option value="planejamento">Planejamento</option><option value="ativa">Ativa</option>
        <option value="pausada">Pausada</option><option value="encerrada">Encerrada</option>
      </select>
      <select id="filtro-segmento">
        <option value="">Segmento: Todos</option>
        <option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option>
      </select>
    </div>
    <div id="lista-campanhas" style="display:flex;flex-direction:column;gap:12px;"></div>
  </section>
</div>

<div class="modal-overlay oculto" id="modal">
  <div class="modal" style="max-width:560px;">
    <h2 id="modal-titulo">Nova campanha</h2>
    <input type="hidden" id="campo-id">
    <div class="campo"><label>Nome</label><input type="text" id="campo-nome"></div>
    <div class="campo"><label>Status</label>
      <select id="campo-status"><option value="planejamento">Planejamento</option><option value="ativa">Ativa</option>
        <option value="pausada">Pausada</option><option value="encerrada">Encerrada</option></select>
    </div>
    <div class="campo"><label>Segmento</label>
      <select id="campo-segmento"><option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option></select>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="campo" style="flex:1"><label>Início</label><input type="date" id="campo-inicio"></div>
      <div class="campo" style="flex:1"><label>Fim</label><input type="date" id="campo-fim"></div>
    </div>
    <div class="campo"><label>Objetivo</label><input type="text" id="campo-objetivo"></div>
    <div style="display:flex;gap:10px;">
      <div class="campo" style="flex:1"><label>Orçamento previsto (R$)</label><input type="text" id="campo-orcamento"></div>
      <div class="campo" style="flex:1"><label>Valor investido (R$)</label><input type="text" id="campo-investido"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="campo" style="flex:1"><label>Leads</label><input type="text" id="campo-leads"></div>
      <div class="campo" style="flex:1"><label>Contatos</label><input type="text" id="campo-contatos"></div>
      <div class="campo" style="flex:1"><label>Conversões</label><input type="text" id="campo-conversoes"></div>
    </div>
    <div class="campo"><label>Valor de conversão (R$)</label><input type="text" id="campo-valor-conversao"></div>
    <div class="campo"><label>Peças/criativos</label><input type="text" id="campo-pecas"></div>
    <div class="campo"><label>Link principal</label><input type="text" id="campo-link"></div>
    <div class="campo"><label>Observações</label><textarea id="campo-observacoes" rows="2"></textarea></div>
    <div class="modal-acoes">
      <button class="btn-secundario" id="btn-cancelar">Cancelar</button>
      <button class="btn-secundario oculto" id="btn-duplicar">Duplicar</button>
      <button class="btn-perigo oculto" id="btn-excluir">Excluir</button>
      <button class="btn-primario" id="btn-salvar">Salvar</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/campanhas.js"></script>
</body>
</html>
