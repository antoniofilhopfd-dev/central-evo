<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram — Central Evolução</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/evolucao-icone-laranja.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="topbar">
  <div class="marca"><img class="logo" src="assets/logo/evolucao-lockup-branco.svg" alt="Colégio Evolução"><span>Central</span></div>
  <div class="status-indicadores"><span><i class="bolinha" id="ind-nuvem"></i> Nuvem (API)</span></div>
</div>

<div class="container">
  <div class="rodape-nav"><a href="index.html">&larr; Voltar para a Central</a></div>
  <h1>Instagram</h1>

  <section class="secao">
    <div class="toolbar">
      <select id="filtro-conta">
        <option value="">Conta: Todas</option>
        <option value="evolucaopb">@evolucaopb</option>
        <option value="geracaoevolucao">@geracaoevolucao</option>
      </select>
      <select id="filtro-periodo">
        <option value="30">Últimos 30 dias</option>
        <option value="7">Últimos 7 dias</option>
        <option value="mes">Este mês</option>
        <option value="">Tudo</option>
      </select>
      <select id="filtro-tipo">
        <option value="">Tipo: Todos</option>
        <option value="post">Post</option><option value="reels">Reels</option><option value="story">Story</option>
      </select>
      <select id="filtro-segmento">
        <option value="">Segmento: Todos</option>
        <option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option>
      </select>
      <span style="flex:1"></span>
      <button class="btn-primario" id="btn-novo-conteudo">+ Novo conteúdo</button>
      <button class="btn-secundario" id="btn-nova-metrica">+ Métricas da conta</button>
    </div>

    <div class="resumo-cards" id="resumo-ig">
      <div class="resumo-card"><div class="numero" id="ig-conteudos">0</div><div class="rotulo">Conteúdos</div></div>
      <div class="resumo-card"><div class="numero" id="ig-alcance">0</div><div class="rotulo">Alcance</div></div>
      <div class="resumo-card"><div class="numero" id="ig-engajamentos">0</div><div class="rotulo">Engajamentos</div></div>
      <div class="resumo-card"><div class="numero" id="ig-taxa">0%</div><div class="rotulo">Taxa média</div></div>
      <div class="resumo-card"><div class="numero" id="ig-seguidores">0</div><div class="rotulo">Seguidores ganhos</div></div>
    </div>
  </section>

  <section class="secao">
    <h2 style="font-size:1rem;">Comparação entre contas</h2>
    <div id="tabela-comparativo"></div>
  </section>

  <section class="secao">
    <h2 style="font-size:1rem;">Ranking por engajamento</h2>
    <div class="lista-tarefas" id="lista-ranking"></div>
  </section>
</div>

<div class="modal-overlay oculto" id="modal-conteudo">
  <div class="modal">
    <h2>Novo conteúdo</h2>
    <div class="campo"><label>Conta</label>
      <select id="c-conta"><option value="evolucaopb">@evolucaopb</option><option value="geracaoevolucao">@geracaoevolucao</option></select>
    </div>
    <div class="campo"><label>Data</label><input type="date" id="c-data"></div>
    <div class="campo"><label>Tipo</label>
      <select id="c-tipo"><option value="post">Post</option><option value="reels">Reels</option><option value="story">Story</option></select>
    </div>
    <div class="campo"><label>Segmento</label>
      <select id="c-segmento"><option value="geral">Geral</option><option value="infantil">Infantil</option>
        <option value="anos_iniciais">Anos Iniciais</option><option value="anos_finais">Anos Finais</option>
        <option value="ensino_medio">Ensino Médio</option></select>
    </div>
    <div class="campo"><label>Título/tema</label><input type="text" id="c-titulo"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <div class="campo" style="flex:1;min-width:100px"><label>Alcance</label><input type="text" id="c-alcance"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Impressões</label><input type="text" id="c-impressoes"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Curtidas</label><input type="text" id="c-curtidas"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Comentários</label><input type="text" id="c-comentarios"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Compart.</label><input type="text" id="c-compartilhamentos"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Salvamentos</label><input type="text" id="c-salvamentos"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Cliques</label><input type="text" id="c-cliques"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Visualizações</label><input type="text" id="c-visualizacoes"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Seg. ganhos</label><input type="text" id="c-seguidores-ganhos"></div>
    </div>
    <div class="campo"><label>Link</label><input type="text" id="c-link"></div>
    <div class="campo"><label>Observações</label><textarea id="c-observacoes" rows="2"></textarea></div>
    <div class="modal-acoes">
      <button class="btn-secundario" onclick="document.getElementById('modal-conteudo').classList.add('oculto')">Cancelar</button>
      <button class="btn-primario" id="btn-salvar-conteudo">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay oculto" id="modal-metrica">
  <div class="modal">
    <h2>Métricas da conta</h2>
    <div class="campo"><label>Conta</label>
      <select id="m-conta"><option value="evolucaopb">@evolucaopb</option><option value="geracaoevolucao">@geracaoevolucao</option></select>
    </div>
    <div style="display:flex;gap:8px;">
      <div class="campo" style="flex:1"><label>Data inicial</label><input type="date" id="m-data-inicial"></div>
      <div class="campo" style="flex:1"><label>Data final</label><input type="date" id="m-data-final"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <div class="campo" style="flex:1;min-width:100px"><label>Seguidores ao final</label><input type="text" id="m-seguidores-final"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Alcance</label><input type="text" id="m-alcance"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Impressões</label><input type="text" id="m-impressoes"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Visitas ao perfil</label><input type="text" id="m-visitas"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Interações</label><input type="text" id="m-interacoes"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Cliques no link</label><input type="text" id="m-cliques-link"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Seg. ganhos</label><input type="text" id="m-seguidores-ganhos"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Seg. perdidos</label><input type="text" id="m-seguidores-perdidos"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Posts publicados</label><input type="text" id="m-posts"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Reels publicados</label><input type="text" id="m-reels"></div>
      <div class="campo" style="flex:1;min-width:100px"><label>Stories publicados</label><input type="text" id="m-stories"></div>
    </div>
    <div class="campo"><label>Observações</label><textarea id="m-observacoes" rows="2"></textarea></div>
    <div class="modal-acoes">
      <button class="btn-secundario" onclick="document.getElementById('modal-metrica').classList.add('oculto')">Cancelar</button>
      <button class="btn-primario" id="btn-salvar-metrica">Salvar</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/instagram.js"></script>
</body>
</html>
